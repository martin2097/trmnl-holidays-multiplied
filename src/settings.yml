polling_url: "{% assign calendar_code = holiday_calendar | default: 'cz' | split: '-' | first | upcase %}\r\n{% assign this_year = 'now' | date: '%Y' | plus: 0 %}\r\n{% assign month = 'now' | date: '%m' | plus: 0 %}\r\nhttps://nagerholidays.com/api/v4/Holidays/{{ calendar_code }}/{{ this_year }}\r\nhttps://nagerholidays.com/api/v4/Holidays/{{ calendar_code }}/{{ this_year | plus: 1 }}\r\n{% if month == 1 %}\r\nhttps://nagerholidays.com/api/v4/Holidays/{{ calendar_code }}/{{ this_year | minus: 1 }}\r\n{% endif %}\r\n{% if month == 12 %}\r\nhttps://nagerholidays.com/api/v4/Holidays/{{ calendar_code }}/{{ this_year | plus: 2 }}\r\n{% endif %}\r\n{% if calendar_code == 'GB' %}\r\nhttps://www.gov.uk/bank-holidays.json\r\n{% endif %}\r\nhttps://pto-world-data.slowtech.workers.dev/v1/world\r\n"
